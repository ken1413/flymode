[package]
name = "timewaver-monitor"
version = "0.1.0"
edition = "2021"
description = "System tray monitor for TimeWaver Pro - auto-restarts if process stops"

[[bin]]
name = "timewaver-monitor"
path = "src/main.rs"

[dependencies]
tray-icon = "0.19"
muda = "0.15"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
